x-base: &base
  restart: unless-stopped
  networks:
    - calibre-web-swarm_default

services:
  calibre-web:
    <<: *base
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: ${CNAME}
    user: ${PUID}:${PGID}
    environment:
      - TZ=${TZ}
      - DOCKER_MODS=linuxserver/mods:universal-calibre
      - OAUTHLIB_RELAX_TOKEN_SCOPE=1
    volumes:
      - calibre-web.config:/config
      - calibre.library:/db
      - /media/Multimedia/books:/books
    ports:
      - target: 8083
        published: 8083
        protocol: tcp
        mode: host
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.deployment.target.calibre-web == true
      restart_policy:
        condition: on-failure

volumes:
  calibre-web.config:
    name: calibre-web-swarm.config
  calibre.library:
    name: calibre-swarm.config

networks:
  calibre-web-swarm_default:
    external: true
    name: calibre-web-swarm_default
