services:
  calibre-web:
    image: linuxserver/calibre-web:latest
    container_name: calibre-web-swarm
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/Chicago
    - DOCKER_MODS=linuxserver/mods:universal-calibre
    - OAUTHLIB_RELAX_TOKEN_SCOPE=1
    volumes:
    - calibre-web-swarm_config:/config
    ports:
    - target: 8083
      published: 8083
      protocol: tcp
      mode: host
    deploy:
      placement:
        constraints:
        - node.role==manager
      restart_policy:
        condition: on-failure
volumes:
  calibre-web-swarm_config:
    name: calibre-web-swarm_config
