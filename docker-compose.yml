x-base: &base
  restart: unless-stopped
  networks:
    - calibre-web-swarm_default

services:
  calibre-web:
    <<: *base
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: ${CNAME}
    user: ${PUID}:${PGID}
    environment:
      - TZ=${TZ}
      - DOCKER_MODS=linuxserver/mods:universal-calibre
      - OAUTHLIB_RELAX_TOKEN_SCOPE=1
    volumes:
      - /var/lib/docker/volumes/calibre-web-swarm/config:/config
      - /var/lib/docker/volumes/calibre-swarm/config/Calibre Library:/db
      - /media/Multimedia/books:/books
    ports:
      - target: 8083
        published: 8083
        protocol: tcp
        mode: host
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.deployment.target.calibre-web == true
      restart_policy:
        condition: on-failure

networks:
  calibre-web-swarm_default:
    external: true
    name: calibre-web-swarm_default
